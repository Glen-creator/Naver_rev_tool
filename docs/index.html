<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>파인다이닝 찾기</title>
<meta name="description" content="파인다이닝 서치 헬퍼(웍스 봇) 추천 전체 목록과 매장 검색 — 사진·후기·룸·가격대를 보고 네이버 예약·캐치테이블로 바로 이동">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'NanumSquare';font-weight:400;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquare/NanumSquareR.woff) format('woff')}
@font-face{font-family:'NanumSquare';font-weight:700;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquare/NanumSquareB.woff) format('woff')}
@font-face{font-family:'NanumSquare';font-weight:800;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquare/NanumSquareEB.woff) format('woff')}
:root{--g:#03C75A;--g-d:#02A84B;--g-dd:#017A37;--g-l:#E8F8EF;--g-ll:#F3FBF6;--ink:#1F2328;--ink2:#3D434A;--mut:#6B7178;--mut2:#9AA0A6;
  --line:#E3E5E8;--line2:#D3D6DA;--bg:#FFFFFF;--bg2:#F7F8F9;--gold:#B8860B;--red:#D93025;--amber:#B26A00;--wine:#6b2737;--orange:#ff7a00;
  --font:'NanumSquare',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--r:10px;--wrap:1100px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit}button,input,select{font-family:var(--font);font-size:inherit;color:inherit}
[hidden]{display:none!important}
.lnk{background:none;border:none;color:var(--g-dd);font-weight:700;cursor:pointer;padding:2px 4px;text-decoration:none}
/* GNB */
.gnb{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:30}
.gnb-in{max-width:var(--wrap);margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:19px;letter-spacing:-.4px}
.logo b{font-weight:800}
.logo .dot{width:24px;height:24px;border-radius:50%;background:var(--g);position:relative;flex:none}
.logo .dot::after{content:'';position:absolute;inset:7px;border-radius:50%;background:#fff}
.gnb-r{display:flex;align-items:center;gap:16px;font-size:14px}
.gl{text-decoration:none;color:var(--ink2);font-weight:700}.gl:hover{color:var(--g-dd)}
/* 검색 바 */
.sbar-wrap{padding:20px 20px 6px}
.sbar{max-width:var(--wrap);margin:0 auto;display:flex;gap:10px;align-items:stretch}
.sb-grp{display:flex;flex:0 0 auto;border:1px solid var(--line2);border-radius:var(--r);background:#fff}
.sb{display:flex;align-items:center;gap:8px;padding:0 12px;height:52px;position:relative;background:#fff;border-radius:var(--r)}
.sb-grp .sb{border-radius:0}.sb-grp .sb+.sb{border-left:1px solid var(--line)}
.sb-grp .sb:first-child{border-radius:var(--r) 0 0 var(--r)}.sb-grp .sb:last-child{border-radius:0 var(--r) var(--r) 0}
.i{width:20px;height:20px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sb input,.sb select{border:none;outline:none;background:transparent;font-size:15px;height:100%;cursor:pointer}
.sb-date input{width:128px}.sb-time select{width:92px}.sb-party select{width:80px}
.sb-q{flex:1;border:1px solid var(--line2);min-width:0}.sb-q input{flex:1;min-width:0;cursor:text}
.sb-q:focus-within,.sb-grp:focus-within{border-color:var(--g);box-shadow:0 0 0 3px rgba(3,199,90,.15)}
.sb-x{border:none;background:none;font-size:20px;color:var(--mut2);cursor:pointer;padding:0 4px}
.sb-go{flex:0 0 120px;border:none;border-radius:var(--r);background:var(--g);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.sb-go:hover{background:var(--g-d)}
.hint{max-width:var(--wrap);margin:6px auto 0;padding:0 20px;font-size:12.5px;color:var(--mut)}
.hint .ex{color:var(--g-dd);font-weight:700;cursor:pointer;background:none;border:none;padding:0 2px}
/* 결과 */
.res{max-width:var(--wrap);margin:0 auto;padding:14px 20px 40px}
.aibar{background:var(--g-ll);border:1px solid #CDEFD9;border-radius:12px;padding:12px 14px;margin:8px 0 14px}
.aibar .q{font-size:14px;color:var(--ink2);margin-bottom:6px}.aibar .q b{color:var(--g-dd)}
.aibar .src{display:inline-block;font-size:11.5px;color:#fff;background:var(--g-d);border-radius:4px;padding:1px 6px;margin-right:6px;font-weight:800;vertical-align:1px}
.aibar .note{font-size:12.5px;color:var(--mut);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:20px;padding:4px 11px;font-size:13px;font-weight:700}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rcnt{font-size:17px}.rcnt b{font-weight:800}.rcnt small{font-size:12.5px;color:var(--mut);margin-left:6px}
.rhead select{border:1px solid var(--line2);border-radius:8px;background:#fff;padding:8px 10px;font-size:13.5px;font-weight:700;cursor:pointer}
.card{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.card.focus{background:var(--g-ll);margin:0 -12px;padding:20px 12px;border-radius:12px;border-bottom:none}
.phwrap{position:relative;width:200px;height:200px}
.card .ph{width:200px;height:200px;border-radius:10px;object-fit:cover;background:var(--bg2);display:block}
.card .ph0{display:grid;place-items:center;color:var(--mut2);font-size:13px}
.phwrap .rk{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.bd{font-size:12px;font-weight:800;border-radius:5px;padding:2px 7px;background:var(--bg2);color:var(--ink2)}
.bd.mi{background:#FFF4D6;color:#8A5A00}.bd.on{background:var(--g-l);color:var(--g-dd)}.bd.rm{background:#EEF3FF;color:#2F55B5}
.bd.fd{background:#F3E8FF;color:#6D28D9}.bd.reco{background:#FFE9E9;color:#B42318}.bd.ext{background:#FFF1DB;color:#9A5B00}.bd.nos{background:#F1F3F5;color:#5F7285}
.card h3{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.card h3 a{text-decoration:none;color:#1A5FA8}.card h3 a:hover{text-decoration:underline}
.card h3 .no{color:var(--mut2);font-weight:700;margin-right:4px}
.meta{font-size:14.5px;color:var(--ink2);margin-bottom:8px}.meta .sep{color:var(--mut2);margin:0 6px}.meta .prc{font-weight:800}
.rvw{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px;font-size:13px}
.rvw b{color:var(--gold);font-weight:800}.rvw .n{color:var(--mut)}
.rvw .kw{background:var(--bg2);border-radius:14px;padding:2px 9px;color:var(--ink2)}
.why{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink2);background:#fff;border:1px dashed #BFE8CF;border-radius:8px;padding:7px 10px;margin:6px 0 0}
.why i{font-style:normal;color:var(--mut2);font-size:11.5px;display:block}
.avmsg{font-size:13.5px;color:var(--mut);margin:8px 0 4px}.avmsg.ok{color:var(--g-dd);font-weight:800}.avmsg.warn{color:var(--amber);font-weight:700}.avmsg.bad{color:var(--red);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 13px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--g);color:var(--g-dd)}
.btn.go{background:var(--g);border-color:var(--g);color:#fff}.btn.go:hover{background:var(--g-d)}
.btn.catch{background:var(--orange);border-color:var(--orange);color:#fff}.btn.catch:hover{background:#e86f00;color:#fff}
.btn.tel{color:var(--wine);border-color:#e3c9cf}
.subh{font-size:15px;font-weight:800;color:var(--mut);padding:26px 0 0}
.empty{padding:40px 0;text-align:center;color:var(--mut)}
.pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:22px auto 0}
.pager .pg{min-width:36px;height:36px;border:1px solid var(--line2);background:#fff;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;padding:0 8px}
.pager .pg.on{background:var(--g);border-color:var(--g);color:#fff}.pager .pg:disabled{opacity:.35;cursor:default}
.pager .pg.dots{border:none;background:none;cursor:default;min-width:20px}
.pager .pgi{font-size:12.5px;color:var(--mut);width:100%;text-align:center;margin-top:4px}
.ext .extnote{font-size:13px;color:var(--mut);margin:6px 0 0}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--g-l);border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.fallback{border:1px dashed var(--line2);border-radius:10px;padding:14px;margin-top:10px;font-size:14px;color:var(--ink2)}
.ft{border-top:1px solid var(--line);margin-top:40px}.ft-in{max-width:var(--wrap);margin:0 auto;padding:22px 20px 34px;font-size:12.5px;color:var(--mut);line-height:1.7}
@media (max-width:760px){
  .gnb-in{padding:0 14px}.gnb-r{gap:10px;font-size:13px}
  .sbar-wrap{padding:12px 14px 4px}.sbar{flex-direction:column;gap:8px}
  .sb-grp .sb{flex:1;min-width:0;padding:0 8px;gap:4px}.sb-grp .sb .i{display:none}
  .sb-date input,.sb-time select,.sb-party select{width:100%;font-size:14px}
  .sb-go{flex:none;height:48px}.sb{height:48px}
  .hint{padding:0 14px}
  .res{padding:8px 14px 30px}
  .card{grid-template-columns:96px 1fr;gap:12px;padding:16px 0}
  .phwrap,.card .ph{width:96px;height:96px}
  .card h3{font-size:16.5px}.meta{font-size:13px}
  .btn{padding:7px 10px;font-size:13px}
}
</style>
</head>
<body>
<header class="gnb"><div class="gnb-in">
  <a class="logo" href="./" aria-label="홈"><span class="dot"></span><b>파인다이닝</b>&nbsp;찾기</a>
  <nav class="gnb-r"><a class="gl" href="history.html">검색 이력·인사이트</a></nav>
</div></header>

<section class="sbar-wrap">
  <form class="sbar" id="sbar" autocomplete="off">
    <div class="sb-grp">
      <label class="sb sb-date"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg><input type="date" id="sDate" aria-label="날짜"></label>
      <label class="sb sb-time"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><select id="sTime" aria-label="시간"></select></label>
      <label class="sb sb-party"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg><select id="sParty" aria-label="인원"></select></label>
    </div>
    <div class="sb sb-q">
      <svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
      <input id="sQ" placeholder="매장명 또는 조건 — 예) 청담 룸 한식 6명" aria-label="검색">
      <button type="button" class="sb-x" id="sQx" aria-label="지우기" hidden>×</button>
    </div>
    <button class="sb-go" type="submit">찾기</button>
  </form>
  <div class="hint">예시: <button type="button" class="ex" data-q="청담 룸 있는 한식 6명">청담 룸 있는 한식 6명</button> · <button type="button" class="ex" data-q="광화문 미쉐린 2명">광화문 미쉐린 2명</button> · <button type="button" class="ex" data-q="판교 오마카세">판교 오마카세</button> · 리스트에 없는 매장도 이름으로 찾아져요</div>
</section>

<section class="res">
  <div class="aibar" id="aibar" hidden></div>
  <div class="rhead">
    <div class="rcnt" id="rcnt"></div>
    <select id="vSort" aria-label="정렬"><option value="reco">추천순</option><option value="rv">리뷰 많은 순</option><option value="sc">평점 높은 순</option><option value="mi">미쉐린·수상순</option><option value="pv">인기(PV)순</option><option value="name">가나다순</option></select>
  </div>
  <div id="vCards"></div>
  <nav class="pager" id="vPager" hidden aria-label="페이지"></nav>
  <div id="vExt"></div>
</section>

<footer class="ft"><div class="ft-in">
  매장 정보는 비서진 예약툴 카탈로그(네이버 플레이스 공개 정보·세일즈 어드민 파인다이닝 티어) 기준이며 <span id="asof"></span> 갱신. 네이버 예약·캐치테이블 버튼은 각 서비스 페이지로 이동합니다(모바일은 앱으로 열려 로그인이 유지돼요).<br>
  예약 가능 여부는 웍스 봇이 질문 시점에 확인한 값이라 바뀔 수 있어요 — 예약 페이지에서 다시 확인해 주세요. 문의: 플레이스사업개발1팀 김훈기
</div></footer>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=ymd(new Date());
const WDK='일월화수목금토';
const md=s=>{const d=new Date(s+'T00:00:00');return isNaN(d)?s:(d.getMonth()+1)+'/'+d.getDate()+'('+WDK[d.getDay()]+')'};
const MI_S={'★★★':4,'★★':3,'★':2,'셀렉티드':1};const miS=d=>MI_S[d.mi]||0;
const QS=new URLSearchParams(location.search);
const API=(QS.get('api')||'https://place-admin.io.naver.com').replace(/\/$/,'');   // 리스트 밖 매장 검색(사내망에서만 닿음)
const GO='go.html?u=';   // 네이버·캐치 링크 중계(모바일은 앱으로)
const go=u=>GO+encodeURIComponent(u);
const placeUrl=d=>'https://m.place.naver.com/restaurant/'+d.pid+'/home';
const bookUrl=d=>'https://m.place.naver.com/place/'+d.pid+'/booking?entry=plt';
const reviewUrl=d=>'https://m.place.naver.com/restaurant/'+d.pid+'/review/visitor';
const thumb=(u,typ)=>u?('https://search.pstatic.net/common/?autoRotate=true&type='+(typ||'f320_240')+'&src='+encodeURIComponent(u)):'';
const PAGE=15;
let CAT=null,BYPID={},META={hoods:[],areas:[]};
let S=null,PG=1,EXT={key:'',items:null,busy:false,err:'',q:''};

/* ---------- 검색 바 ---------- */
function initBar(){
  $('#sDate').value=QS.get('d')||TODAY;
  const ts=[];for(let m=11*60;m<=22*60;m+=30)ts.push(pad(Math.floor(m/60))+':'+pad(m%60));
  $('#sTime').innerHTML='<option value="">시간</option>'+ts.map(t=>{const h=+t.slice(0,2);return '<option value="'+t+'">'+(h<12?'오전 ':'오후 ')+((h+11)%12+1)+':'+t.slice(3)+'</option>'}).join('');
  $('#sTime').value=QS.get('t')||'';
  $('#sParty').innerHTML='<option value="">인원</option>'+Array.from({length:20},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'명</option>').join('')+'<option value="30">20명 이상</option>';
  $('#sParty').value=QS.get('n')||'';
  $('#sbar').addEventListener('submit',e=>{e.preventDefault();search($('#sQ').value.trim())});
  const q=$('#sQ');q.addEventListener('input',()=>{$('#sQx').hidden=!q.value});
  $('#sQx').addEventListener('click',()=>{q.value='';$('#sQx').hidden=true;q.focus()});
  $$('.hint .ex').forEach(b=>b.addEventListener('click',()=>{q.value=b.dataset.q;$('#sQx').hidden=false;search(b.dataset.q)}));
  $('#vSort').addEventListener('change',()=>{PG=1;render()});
  ['#sDate','#sTime','#sParty'].forEach(s=>$(s).addEventListener('change',()=>{if(S){S.date=$('#sDate').value;S.time=$('#sTime').value;S.party=+$('#sParty').value||0;render()}}));
  document.addEventListener('click',e=>{const b=e.target.closest('[data-pg]');if(b&&!b.disabled){PG=+b.dataset.pg;render();$('#rcnt').scrollIntoView({block:'start',behavior:'smooth'})}});
}

/* ---------- 조건 해석(로컬, AI 없이) ---------- */
const FOODS=[['한식',/한식|한정식|한우|고기|고깃|소고기|갈비|구이/],['한우',/한우|고기|고깃|소고기|갈비|스테이크하우스/],['일식',/일식|스시|초밥|오마카세|사시미|가이세키|갓포|이자카야/],['양식',/양식|이탈리안|이탈리아|프렌치|프랑스|스테이크|파스타|컨템포러리|모던/],['중식',/중식|중국|중화|딤섬/],['아시안',/아시안|타이|태국|베트남|인도/],['바·라운지',/바\b|라운지|와인바|칵테일/],['퓨전',/퓨전/]];
function parse(q){
  const p={q,hood:new Set(),area:'',food:new Set(),room:false,rent:false,mi:false,oma:false,fd:false,party:0,priceMax:0,name:''};
  const t=q.replace(/\s+/g,' ');
  for(const h of META.hoods){for(const part of h.hood.split('·')){if(part.length>=2&&t.includes(part)){p.hood.add(h.hood)}}}
  for(const a of META.areas){for(const part of a.split('·')){if(part.length>=2&&t.includes(part)&&!p.hood.size)p.area=a}}
  if(/강남권|강남 ?쪽/.test(t)&&!p.hood.size)p.area='강남·서초';
  if(/분당|판교|성남/.test(t)&&!p.hood.size)p.area='분당·판교';
  if(/광화문|종로|시청|을지로|명동|도심/.test(t)&&!p.hood.size)p.area='광화문·도심';
  if(/부산|해운대|광안리|서면/.test(t))p.area='부산';
  for(const [f,re] of FOODS)if(re.test(t))p.food.add(f);
  if(/스테이크|이탈리|프렌치|파스타/.test(t)){p.food.delete('한우');p.food.delete('한식')}
  p.oma=/오마카세|스시|초밥/.test(t);if(p.oma){p.food.delete('한식')}
  p.room=/룸|독립 ?공간|프라이빗|단체석|별실/.test(t);p.rent=/대관|통째|단독 ?사용/.test(t);
  p.mi=/미쉐린|미슐랭|스타|★/.test(t);p.fd=/파인|코스|접대|임원/.test(t);
  const m=/(\d{1,2})\s*(명|인)/.exec(t);if(m)p.party=+m[1];
  const pm=/(\d{1,3})\s*만\s*원?\s*(이하|이내|아래|미만|안)/.exec(t);if(pm)p.priceMax=+pm[1]*10000;
  return p;
}
const hasCond=p=>!!(p.hood.size||p.area||p.food.size||p.room||p.rent||p.mi||p.oma||p.fd||p.party||p.priceMax);
function passes(d,p){
  if(p.hood.size&&!p.hood.has(d.hood))return false;
  if(!p.hood.size&&p.area&&d.area!==p.area)return false;
  if(p.food.size&&![...p.food].some(f=>d.food===f||(d.pcCat||'').includes(f.slice(0,2))||(f==='한우'&&d.meat)))return false;
  if(p.room&&d.room==='X')return false;
  if(p.rent&&d.rent!=='O')return false;
  if(p.mi&&!d.mi)return false;
  if(p.oma&&!d.oma)return false;
  if(p.party&&d.capmax&&d.room==='O'&&p.party>d.capmax&&d.rent!=='O')return false;
  if(p.priceMax&&d.plo&&d.plo>p.priceMax)return false;
  return true;
}
function relax(p){   // 조건을 하나씩 풀어 0곳을 피한다(봇의 relax 체인과 같은 순서)
  if(p.priceMax){p.priceMax=0;return '가격대 조건 제외'}
  if(p.mi){p.mi=false;return '미쉐린 조건 제외'}
  if(p.hood.size){const a=META.hoods.find(h=>p.hood.has(h.hood));p.hood.clear();if(a)p.area=a.area;return '동네 → 권역으로 확대'}
  if(p.area){p.area='';return '지역 조건 제외'}
  if(p.rent){p.rent=false;return '대관 조건 제외'}
  if(p.room){p.room=false;return '룸 조건 제외'}
  if(p.food.size){p.food.clear();return '음식 조건 제외'}
  return '';
}
const RANK_BONUS={0:30,1:12,2:4,3:-25,4:-30};
function fitScore(d){
  let sc=0;const p=S.p,cap=d.capmax,r=S.rank[d.pid];
  if(r!=null)sc+=RANK_BONUS[r]||0;else sc+=d.booking?8:2;
  if(S.party&&cap){if(S.party>cap)sc-=25;else if(S.party>=cap*0.5)sc+=4}
  if(p&&(p.fd||p.mi))sc+=miS(d)*8+(d.awards||[]).length*2;
  if(p&&p.oma)sc+=(d.oma?12:0)+miS(d)*3;
  if(p&&(p.room||p.rent)){if(cap&&S.party&&S.party<=cap)sc+=8;if(d.room==='O')sc+=6}
  if(p&&p.food.size&&d.pcCat&&[...p.food].some(f=>d.pcCat.includes(f.slice(0,2))))sc+=3;
  const pr={'1':4,'2':2.5,'3':1,'4':0}[(d.prio||'').charAt(0)]||1;
  sc+=miS(d)*2+(d.room==='O'?2:0)+pr+(d.searchable?3:0)+(d.rwsc?Math.max(0,(d.rwsc-4.3)*6):0);
  return sc;
}
function rnd(pid){let h=2166136261^Math.floor((S.seed||0)*1e9);for(const c of String(pid)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967296}
function sortRows(rows){
  const k=$('#vSort').value,pvK=d=>-(d.pv||0);
  const keys={
    reco:d=>[S.order[d.pid]!=null?0:1,S.order[d.pid]!=null?S.order[d.pid]:-(fitScore(d)+Math.min(4,Math.log10((d.pv||0)+1))+rnd(d.pid)*8)],
    mi:d=>[-(miS(d)*3+(d.awards||[]).length),pvK(d)],
    pv:d=>[pvK(d)],
    rv:d=>[-(d.rwn||0),pvK(d)],
    sc:d=>[-(d.rwsc||0),-(d.rwn||0),pvK(d)],
    name:d=>[d.name]};
  const f=keys[k]||keys.reco;
  return rows.map(d=>({d,k:f(d)})).sort((a,b)=>{for(let i=0;i<a.k.length;i++){if(a.k[i]<b.k[i])return -1;if(a.k[i]>b.k[i])return 1}return 0}).map(x=>x.d);
}

function blank(){return {mode:'home',q:'',p:null,rows:[],order:{},rank:{},relaxed:[],nMatch:0,date:$('#sDate').value||TODAY,time:$('#sTime').value,party:+$('#sParty').value||0,focus:null,seed:Math.random(),missing:0}}
/* 웍스 봇 [더 보기] — p=pid[:rank],… 순서 그대로 */
function fromBot(){
  S=blank();S.mode='bot';S.q=QS.get('q')||'';S.nMatch=+QS.get('m')||0;S.p=S.q?parse(S.q):null;
  const rows=[];(QS.get('p')||'').split(',').forEach((tok,i)=>{const [pid,rk]=tok.split(':');const d=BYPID[pid];if(!d){S.missing++;return}S.order[pid]=i;if(rk!==undefined&&rk!=='')S.rank[pid]=+rk;rows.push(d)});
  S.rows=rows;
}
function search(q){
  S=blank();S.q=q;PG=1;EXT={key:'',items:null,busy:false,err:'',q:''};
  const url=new URL(location.href);['p','m'].forEach(k=>url.searchParams.delete(k));if(q)url.searchParams.set('q',q);else url.searchParams.delete('q');history.replaceState(null,'',url.pathname+(url.search||''));
  if(!q){S.mode='home';S.rows=CAT.entries.filter(d=>d.searchable&&!d.closed);render();return}
  const n=norm(q);
  const hit=CAT.entries.filter(d=>!d.closed&&norm(d.name).includes(n));
  if(hit.length&&(hit.length<=5||n.length>=3&&hit.some(d=>norm(d.name)===n))){S.mode='name';S.rows=hit;S.focus=hit.find(d=>norm(d.name)===n)||(hit.length===1?hit[0]:null);render();return}
  S.mode='cond';S.p=parse(q);
  if(!hasCond(S.p)){S.mode='name';S.p=null;S.rows=hit;render();return}   // 조건도 아니고 리스트 이름도 아니면 → 그 이름으로 플레이스(리스트 밖) 검색만
  const base=CAT.entries.filter(d=>!d.closed);
  let rows=base.filter(d=>passes(d,S.p));
  let g=0;while(!rows.length&&g++<8){const msg=relax(S.p);if(!msg)break;S.relaxed.push(msg);rows=base.filter(d=>passes(d,S.p))}
  const nameHit=hit.length?hit:[];
  S.rows=[...nameHit,...rows.filter(d=>!nameHit.includes(d))];S.nMatch=rows.length;
  nameHit.forEach((d,i)=>S.order[d.pid]=i);
  render();
}

    (x.options?'<div class="meta" style="font-size:13px;color:var(--mut)">'+esc(x.options)+'</div>':'')+
    '<div class="acts">'+(x.booking?'<a class="btn go" href="'+go(bookUrl(d))+'" target="_blank" rel="noopener">네이버 예약 ↗</a>':'')+
      '<a class="btn catch" href="'+go('https://app.catchtable.co.kr/ct/search/result?keyword='+encodeURIComponent(x.name))+'" target="_blank" rel="noopener">캐치테이블에서 찾기 ↗</a>'+
      '<a class="btn" href="'+go(placeUrl(d))+'" target="_blank" rel="noopener">플레이스</a>'+
      (x.phone?'<a class="btn tel" href="tel:'+esc(x.phone.replace(/[^\d+]/g,''))+'">☎ '+esc(x.phone)+'</a>':'')+'</div></div></article>';
}

/* ---------- 부팅 ---------- */
async function boot(){
  initBar();
  try{CAT=await fetch('data/catalog.json',{cache:'no-cache'}).then(r=>r.json())}
  catch(e){$('#rcnt').innerHTML='카탈로그를 불러오지 못했어요 — 새로고침해 주세요.';return}
  CAT.entries.forEach(d=>BYPID[d.pid]=d);META=CAT.meta||META;
  $('#asof').textContent=CAT.asof||'';
  if(QS.get('p')){fromBot();if(S.q){$('#sQ').value=S.q;$('#sQx').hidden=false}render()}
  else if(QS.get('q')||QS.get('ask')){const q=QS.get('q')||QS.get('ask');$('#sQ').value=q;$('#sQx').hidden=false;search(q)}
  else search('');
}
boot();
})();
</script>

</html>
