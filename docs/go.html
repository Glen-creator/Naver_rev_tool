<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>네이버 예약 열기</title>
<!--
  중계 페이지 (2026-10-29) — 웍스 봇/예약툴의 네이버 예약 링크를 "이미 네이버에 로그인된 곳"에서 열어 준다.
  웍스 인앱 브라우저는 네이버 로그인 쿠키가 남지 않아 매번 로그인하게 되므로, 모바일이면 네이버 앱(인앱 브라우저 스킴)으로
  넘기고 앱이 없거나 막히면 일반 브라우저 주소로 보낸다. 데스크톱은 바로 원래 주소로 이동.
  사용: go.html?u=<encodeURIComponent(https 네이버 주소)>   — 허용 호스트 밖 주소는 열지 않는다(오픈 리다이렉트 방지).
-->
<style>
:root{--g:#03c75a;--gd:#02a94c;--txt:#1f2328;--sub:#6b7280;--line:#e5e7eb;--bg:#f6f7f9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.logo{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:var(--g);color:#fff;font-weight:900;font-size:26px;letter-spacing:-1px;margin-bottom:12px}
h1{font-size:17px;margin:0 0 6px}
p{margin:0 0 14px;font-size:13px;color:var(--sub);line-height:1.55;word-break:keep-all}
.host{font-size:12px;color:var(--sub);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.btn{display:block;width:100%;padding:13px 12px;border-radius:12px;font-size:15px;font-weight:800;text-decoration:none;margin-top:8px;border:1px solid transparent}
a.app{background:var(--g);color:#fff}a.app:active{background:var(--gd)}
a.web{background:#fff;color:var(--txt);border-color:var(--line)}
.tip{font-size:11.5px;color:var(--sub);margin-top:14px;line-height:1.5}
.err{color:#c0392b;font-weight:700}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="logo">N</div>
  <h1 id="title">네이버 앱으로 여는 중…</h1>
  <p id="desc">네이버 앱이 열리지 않으면 아래 버튼을 눌러 주세요. 앱이 없으면 브라우저로 열립니다.</p>
  <div class="host" id="host"></div>
  <a class="btn app" id="btnApp" href="#">네이버 앱에서 열기</a>
  <a class="btn web" id="btnWeb" href="#" rel="noopener">브라우저에서 열기</a>
  <div class="tip" id="tip">웍스 안에서 열렸다면 오른쪽 위 메뉴의 "다른 브라우저로 열기"를 써도 로그인이 유지된 브라우저로 갑니다.</div>
</div></div>
<script>
(function(){
  var ALLOW = /(^|\.)(booking\.naver\.com|place\.naver\.com|map\.naver\.com|naver\.me|smartplace\.naver\.com)$/i;
  var q = new URLSearchParams(location.search);
  var u = (q.get('u') || '').trim();
  var $ = function(id){ return document.getElementById(id); };
  var fail = function(msg){
    $('title').textContent = '열 수 없는 주소예요';
    $('desc').innerHTML = '<span class="err">' + msg + '</span>';
    $('btnApp').classList.add('hide'); $('btnWeb').classList.add('hide'); $('tip').classList.add('hide'); $('host').classList.add('hide');
  };
  var url;
  try { url = new URL(u); } catch (e) { return fail('주소가 비어 있거나 올바르지 않아요.'); }
  if (url.protocol !== 'https:' || !ALLOW.test(url.hostname)) return fail('네이버 예약·플레이스 주소만 열 수 있어요.');
  u = url.href;
  $('host').textContent = url.hostname + url.pathname;
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua), isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var inNaverApp = /NAVER\(inapp/i.test(ua);
  var enc = encodeURIComponent(u);
  var scheme = 'naversearchapp://inappbrowser?url=' + enc + '&target=new&version=6';
  var intent = 'intent://inappbrowser?url=' + enc + '&target=new&version=6#Intent;scheme=naversearchapp;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.search;S.browser_fallback_url=' + enc + ';end';
  $('btnWeb').href = u;
  $('btnApp').href = isAndroid ? intent : scheme;
  // 데스크톱이거나 이미 네이버 앱 안이면 중계 없이 바로 이동
  if (inNaverApp || (!isAndroid && !isIOS)) { location.replace(u); return; }
  // 모바일: 앱 스킴을 한 번 시도하고, 화면이 그대로면(앱 없음·차단) 브라우저 주소로
  var left = false;
  var onHide = function(){ if (document.visibilityState === 'hidden') left = true; };
  document.addEventListener('visibilitychange', onHide);
  window.addEventListener('pagehide', function(){ left = true; });
  try {
    if (isAndroid) { location.href = intent; } else { location.href = scheme; }
  } catch (e) {}
  setTimeout(function(){
    if (left || document.visibilityState === 'hidden') return;
    $('title').textContent = '네이버 앱이 열리지 않았어요';
    $('desc').textContent = '아래에서 여는 방법을 골라 주세요. 브라우저로 열면 그 브라우저의 네이버 로그인이 쓰여요.';
    setTimeout(function(){ if (!left && document.visibilityState !== 'hidden') location.replace(u); }, 2500);
  }, 1500);
})();
</script>
</body>
</html>
